# MemSolve ImageNet-1K: 300 epochs, global batch 2048, RA and EMA.
# ViT3-derived AdamW/CE recipe used for the paper results.
[defaults]
num_classes = 1000
patch_size = 16
mlp_ratio = 4.0
norm_eps = 1.0e-6
position_encoding = "cpe"
epochs = 300
warmup_epochs = 20
warmup_lr = 2.0e-6
min_lr = 2.0e-5
weight_decay = 0.05
clip_grad = 5.0
seed = 0
train_workers = 12
val_workers = 4
eval_crop_ratio = 0.875
reprob = 0.25
mixup = 0.8
cutmix = 1.0
mixup_prob = 1.0
mixup_switch_prob = 0.5
mixup_mode = "batch"
ema = true
ema_decay = 0.9999
amp_dtype = "bfloat16"
execution = "compile-graph"
save_every = 1
batch_size = 512
effective_batch = 2048
lr = 0.002
optimizer = "fused_adamw"
augmentation = "rand_augment"
color_jitter = 0.4
auto_augment = "rand-m9-mstd0.5-inc1"
repeated_aug = true
bce_loss = false
label_smoothing = 0.1

[operator]
core_mode = "equilibrium"
bias = true
implementation = "cuda"

[tiers.tiny]
embed_dim = 192
depth = 12
num_heads = 6
rank = 16
drop_path_rate = 0.0
[tiers.tiny.pretrain]
input_size = 224

[tiers.small]
mlp_ratio = 4.125
embed_dim = 384
depth = 12
num_heads = 6
rank = 32
drop_path_rate = 0.1
[tiers.small.pretrain]
input_size = 224

[tiers.base]
embed_dim = 768
depth = 12
num_heads = 12
rank = 48
drop_path_rate = 0.4
[tiers.base.pretrain]
input_size = 224
