[experiment]
suite = "genomic"
task = "dummy_mouse_enhancers_ensembl"
data_root = "data/genomic_benchmarks"
cache_root = "data/sequence_cache"
split_seed = 2026
validation_fraction = 0.1

[model]
mixer = "lsso"
implementation = "cuda"
core_mode = "dynamic"
dim = 128
depth = 4
heads = 4
rank = 32
mlp_ratio = 4.0
dropout = 0.1
bias = true

[train]
epochs = 40
eval_batch_size = 256
lr = 0.0003
weight_decay = 0.01
warmup_ratio = 0.05
grad_clip = 1.0
patience = 8
