# ImageNet-1K recipes from facebookresearch/deit commit 7e160fe43f0252d17191b71cbb5826254114ea5b.
# `batch_size` is physical per GPU. `effective_batch` is global and remains
# fixed through derived gradient accumulation; learning rates use --unscale-lr.

[defaults]
num_classes = 1000
patch_size = 16
mlp_ratio = 4.0
layer_scale_init_value = 1.0e-4
norm_eps = 1.0e-6
epochs = 800
warmup_epochs = 5
warmup_lr = 1.0e-6
min_lr = 1.0e-5
weight_decay = 0.05
seed = 0
train_workers = 10
val_workers = 4
eval_crop_ratio = 1.0
reprob = 0.0
mixup = 0.8
cutmix = 1.0
mixup_prob = 1.0
mixup_switch_prob = 0.5
mixup_mode = "batch"
ema = true
ema_decay = 0.99996
amp_dtype = "float16"
save_every = 1

[operator]
core_mode = "dynamic"
bias = true
implementation = "cuda"

[tiers.small]
embed_dim = 384
depth = 12
num_heads = 6
rank = 32
drop_path_rate = 0.05

[tiers.small.pretrain]
input_size = 224
batch_size = 256
effective_batch = 2048
augmentation_group_size = 256
lr = 0.004
optimizer = "fusedlamb"
augmentation = "three_augment"
color_jitter = 0.3
auto_augment = "none"
repeated_aug = true
bce_loss = true
label_smoothing = 0.0

[tiers.base]
embed_dim = 768
depth = 12
num_heads = 12
rank = 48
drop_path_rate = 0.20

[tiers.base.pretrain]
input_size = 192
batch_size = 256
effective_batch = 2048
augmentation_group_size = 256
lr = 0.003
optimizer = "fusedlamb"
augmentation = "three_augment"
color_jitter = 0.3
auto_augment = "none"
repeated_aug = true
bce_loss = true
label_smoothing = 0.0

[tiers.base.finetune_224]
input_size = 224
batch_size = 64
effective_batch = 512
augmentation_group_size = 64
epochs = 20
lr = 1.0e-5
weight_decay = 0.10
optimizer = "adamw"
augmentation = "rand_augment"
color_jitter = 0.0
auto_augment = "rand-m9-mstd0.5-inc1"
repeated_aug = false
bce_loss = false
label_smoothing = 0.1

[tiers.large]
embed_dim = 1024
depth = 24
num_heads = 16
rank = 64
drop_path_rate = 0.45

[tiers.large.pretrain]
input_size = 192
batch_size = 64
effective_batch = 2048
augmentation_group_size = 64
lr = 0.003
optimizer = "fusedlamb"
augmentation = "three_augment"
color_jitter = 0.3
auto_augment = "none"
repeated_aug = true
bce_loss = true
label_smoothing = 0.0

[tiers.large.finetune_224]
input_size = 224
batch_size = 64
effective_batch = 512
augmentation_group_size = 64
epochs = 20
lr = 1.0e-5
weight_decay = 0.10
optimizer = "adamw"
augmentation = "rand_augment"
color_jitter = 0.0
auto_augment = "rand-m9-mstd0.5-inc1"
repeated_aug = false
bce_loss = false
label_smoothing = 0.1
