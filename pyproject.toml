[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memsolve-operator"
version = "0.14.0"
description = "Full-context associative memory via compact equilibrium solves, with linear sequence scaling and PyTorch/Triton acceleration."
keywords = [
    "memsolve", "associative-memory", "global-equilibrium", "bidirectional", "ridge-regression",
    "test-time-training", "linear-complexity", "efficient-transformers",
    "sequence-modeling", "computer-vision", "masked-language-modeling",
    "pytorch", "triton", "cuda",
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.14,<2.15", "tomli>=2; python_version < '3.11'"]

[project.urls]
Repository = "https://github.com/Yang916-yy/MemSolve"
Documentation = "https://github.com/Yang916-yy/MemSolve/blob/main/README.md"
Issues = "https://github.com/Yang916-yy/MemSolve/issues"

[project.optional-dependencies]
nlp = [
    "transformers>=4.57.6,<4.58",
    "accelerate>=1.10,<2",
    "datasets>=4.8,<5",
    "sentence-transformers>=5.7,<5.8",
    "mteb>=2.21,<2.22",
]
assembly101 = [
    "numpy>=1.26",
    "huggingface-hub>=1,<2",
    "lmdb>=1,<3",
    "pandas>=2,<3",
    "einops>=0.8,<1",
    "yacs>=0.1.8,<0.2",
    "tqdm>=4,<5",
    "simplejson>=3,<4",
]
test = [
    "pytest>=8,<10",
    "numpy>=1.26",
    "pillow>=10",
    "webdataset>=1,<2",
    "wids>=0.1.11,<0.2",
]
sequence = [
    "datasets>=3,<5",
    "numpy>=1.26",
    "pillow>=10",
]
vision = [
    "timm>=1.0.16,<2",
    "torchvision>=0.29,<0.30",
    "webdataset>=1,<2",
    "wids>=0.1.11,<0.2",
]
openmmlab = [
    "mmengine>=0.10,<1",
    "mmdet>=3.3,<4",
    "mmsegmentation>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["memsolve*"]

[tool.setuptools.package-data]
memsolve = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "core: reference mathematics, model, configuration, and public API contracts",
    "cuda: CUDA runtime, numerical, or device contract",
    "integration: framework adapter contract",
    "experiment: data and training-entrypoint contract",
    "repository: repository-layout contract",
]
