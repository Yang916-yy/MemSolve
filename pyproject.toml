[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lsso-operator"
version = "0.6.3"
description = "Solved contextual adaptation with certified global mixing and native CUDA."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["torch>=2.14,<2.15", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
assembly101 = [
    "numpy>=1.26",
    "huggingface-hub>=1,<2",
    "lmdb>=1,<3",
    "pandas>=2,<3",
    "einops>=0.8,<1",
    "yacs>=0.1.8,<0.2",
    "tqdm>=4,<5",
    "simplejson>=3,<4",
]
test = [
    "pytest>=8,<10",
    "numpy>=1.26",
    "pillow>=10",
    "webdataset>=1,<2",
]
sequence = [
    "datasets>=3,<5",
    "numpy>=1.26",
    "pillow>=10",
]
vision = [
    "timm>=1.0.16,<2",
    "torchvision>=0.29,<0.30",
    "webdataset>=1,<2",
]
openmmlab = [
    "mmengine>=0.10,<1",
    "mmdet>=3.3,<4",
    "mmsegmentation>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["lsso*"]

[tool.setuptools.package-data]
lsso = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "core: reference mathematics, model, configuration, and public API contracts",
    "cuda: CUDA runtime, numerical, or native-extension contract",
    "integration: framework adapter contract",
    "experiment: data and training-entrypoint contract",
    "repository: repository-layout contract",
]
